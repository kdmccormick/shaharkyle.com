<!--
  The heart constellation from the star chart, at tab size. Same ten stars and
  the same edges, drawn heavier: at 16px the hairlines and 2px dots of the
  real chart disappear entirely.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#1d2738"/>
  <g stroke="#efece1" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"
     fill="none" opacity="0.9">
    <path d="M50,29 L34,15 L17,25 L12,45 L30,68 L50,86 L70,68 L88,45 L83,25 L66,15 Z"/>
  </g>
  <g fill="#efece1">
    <circle cx="34" cy="15" r="4"/>
    <circle cx="17" cy="25" r="4"/>
    <circle cx="12" cy="45" r="4"/>
    <circle cx="30" cy="68" r="4"/>
    <circle cx="70" cy="68" r="4"/>
    <circle cx="88" cy="45" r="4"/>
    <circle cx="83" cy="25" r="4"/>
    <circle cx="66" cy="15" r="4"/>
  </g>
  <!-- the two the chart marks bright: the dip and the point -->
  <g fill="#f6d98a">
    <circle cx="50" cy="29" r="7"/>
    <circle cx="50" cy="86" r="7"/>
  </g>
</svg>
